# PostgreSQL tuning for the graded container budget: 1 CPU, 1 GB RAM.
#
# The workload is append-mostly: high-rate COPY into a daily-partitioned table,
# plus a low volume of time-bounded range scans and aggregations. Every setting
# here is chosen for that shape; defaults assume a far larger, more general box.

listen_addresses = '*'
max_connections = 40                 # app uses ~10; each backend costs memory

# --- memory ------------------------------------------------------------------
shared_buffers = 256MB               # 25% of the cgroup limit
effective_cache_size = 768MB         # planner hint: what the OS is likely caching
work_mem = 8MB                       # aggregation hash/sort; small result sets
maintenance_work_mem = 64MB          # index builds during migration
temp_buffers = 8MB

# --- write path --------------------------------------------------------------
# WAL volume is the primary ingestion bottleneck at 1 CPU. These settings trade
# disk space (cheap) for checkpoint frequency (expensive).
wal_buffers = 16MB
# Sized so the WAL directory stays comfortably under 2 GB on disk. Raising this
# to 4GB measurably improves sustained throughput by making checkpoints rarer
# (and with them, full-page writes), and is worth doing wherever disk allows --
# but running out of WAL space takes PostgreSQL down hard, so the default here
# is the safe one rather than the fastest one.
max_wal_size = 1536MB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB   # smooths checkpoint IO instead of bursting it
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# Group-commit at the server side. When many writer connections commit at once,
# a short delay lets them share one fsync instead of issuing one each.
commit_delay = 0
commit_siblings = 5

# Committed transactions become visible immediately but the WAL flush is
# deferred, bounding crash exposure to roughly 3 * wal_writer_delay of the most
# recent commits. This survives application crashes and clean restarts; only an
# OS or hardware crash can lose the window. The application overrides this
# per-session from PG_SYNCHRONOUS_COMMIT, so flipping that env var to "on" gives
# full synchronous durability without editing this file.
synchronous_commit = off

full_page_writes = on                # left on: torn-page protection is not optional
wal_compression = off                # CPU is scarcer than IO here

# --- background writer -------------------------------------------------------
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 400
bgwriter_lru_multiplier = 4.0

# --- planner -----------------------------------------------------------------
random_page_cost = 1.1               # SSD-backed volume
seq_page_cost = 1.0
effective_io_concurrency = 200

# JIT compilation adds fixed latency to every aggregation and buys nothing at
# this data size. It is a measurable p95 regression on a 1 CPU budget.
jit = off

# With a 1 CPU quota, parallel workers split the same core and add coordination
# overhead. Serial plans are both faster and far more predictable here.
max_parallel_workers_per_gather = 0
max_parallel_workers = 2
max_parallel_maintenance_workers = 1
max_worker_processes = 8

# Partition pruning must happen at both plan time and execution time so that
# aggregation queries touch only the days in range.
enable_partition_pruning = on
# Partitionwise aggregation builds a separate Sort plus Partial GroupAggregate
# for every partition in the plan. Measured here it produced a 252-node plan and
# was markedly slower than a single HashAggregate over an Append, while also
# inflating planning time. Off.
enable_partitionwise_aggregate = off
enable_partitionwise_join = off

# --- autovacuum --------------------------------------------------------------
# The table is append-only, so there are no dead tuples to reclaim, but vacuum
# still sets the visibility map (enabling index-only scans) and freezes tuples.
# Retention drops whole partitions, so vacuum never has to clean up deletes.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_insert_scale_factor = 0.3   # damp churn during sustained ingest
autovacuum_analyze_scale_factor = 0.1

# --- observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 1000    # only genuinely slow statements
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.english'
